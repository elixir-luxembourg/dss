{% extends 'layout.html' %}

{% block title %}{{ title | default('Error') }}{% endblock %}

{% block content %}
    <div class="d-flex flex-column justify-content-start align-items-center vh-100 bg-light shadow-sm text-center pt-5">
        <!-- Icon -->
        <div class="mb-3">
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 120px;"></i>
        </div>

        <!-- Error message -->
        <h1 class="display-4 fw-bold mb-2">{{ message }}</h1>

        <!-- Explanation if available -->
        {% if explanation %}
            <p class="lead text-muted mb-4">{{ explanation }}</p>
        {% endif %}

        <!-- Call to action -->
        {% if show_home_link %}
            <a href="/" class="btn btn-primary btn-lg mt-2">
                <i class="bi bi-house-door-fill me-2"></i>
                Return to Home
            </a>
        {% endif %}
    </div>
{% endblock %}

{% block meta %}
    {{ super() }}
{% endblock %}
