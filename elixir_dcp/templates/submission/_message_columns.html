{% if submission.messages %}
<div class="container">
    <div class="col-md-10">
       <ul class="timeline">
                {% for message in submission.messages %}
                    <li>
                        <div class="d-flex align-items-center justify-content-between gap-2 mb-2">
                            <a href="#">{{ message.sender_user.display_name() }}</a>
                            <a href="#" class="float-end">{{ message.created_on}}</a>
                        </div>
                        <p>{{ message.message_text|safe }}</p>
                    </li>
                {% endfor %}
            </ul>
    </div>
</div>

{% else %}
<div class="text-center py-5">
    <h5 class="text-secondary">No messages found</h5>
</div>
{% endif %}
