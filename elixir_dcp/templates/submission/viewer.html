{% if submission %}
    <div>
        <div>{{ submission.name }}</div>
        <div>{{ submission.description }}</div>
        <div>{{ submission.created_on }}</div>
        <div>{{ submission.joint_providers }}</div>
    </div>

    <div class="btn-group">
        <button id="submission-delete" type="button" class="btn btn-primary" data-url="{{ url_for('api_submission', sub_id=submission.id) }}">Delete</button>
        <button id="submission-share" type="button" class="btn btn-primary" data-url="{{ url_for('api_submission', sub_id=submission.id) }}">Share</button>
    </div>

{% endif %}
