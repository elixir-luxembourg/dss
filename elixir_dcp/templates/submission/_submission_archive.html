{% if submission %}
    <div>
        <div>{{ submission.name }}</div>
        <div>{{ submission.description }}</div>
        <div>{{ submission.created_on }}</div>
        <div>{{ submission.joint_providers }}</div>
    </div>

    <div class="btn-group">
        <button id="submission-archive" type="button" class="btn btn-primary" data-url="{{ url_for('archive_submission', sub_id=submission.id) }}">Archive</button>
    </div>

{% endif %}
