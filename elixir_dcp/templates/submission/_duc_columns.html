{% import 'macros.html' as macros %}
{{ macros.show_flashes() }}

{% if  ducs %}
    <table style="width:700px"  class="table table-striped table-bordered">
        <thead>
        <tr>
            <th width="15%">Name</th>
            <th width="70%">Use Conditions Codes </th>
            <th width="15%">Actions</th>
        </tr>
        </thead>
        {% for duc in ducs %}
            <tr>
                <td>{{ duc.group_name }}</td>
                <td>{{ duc.duc_codes_display() }}</td>
                <td>
                    <a id="submission_duc_listing_delete"
                       data-url="{{ url_for('delete_submission_duc',duc_id=duc.id) }}" role="button">
                        <i class="material-icons">delete</i>
                    </a>
                    <a id="submission_duc_listing_edit"
                       data-url="{{ url_for('add_edit_submission_duc',duc_id=duc.id) }}" role="button">
                        <i class="material-icons">edit</i>
                    </a>
                </td>
            </tr>
        {% endfor %}
    </table>
{% else %}
    <div class="text-center">
    <h3> No Restriction Group has been added yet. </h3>
    </div>
{% endif %}
