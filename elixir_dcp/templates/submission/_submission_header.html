<div class="row">
    <div class="form-group col-md-3">
        <span class="label label-info">Submission Ref No</span><br/><br/>
        <label>{{ submission.ref_name }}</label>
    </div>
    <div class="form-group col-md-3">
        <span class="label label-info">Title</span><br/><br/>
        <label>{{ submission.title }}</label>
    </div>
    <div class="form-group col-md-3">
        <span class="label label-info">Created On</span><br/><br/>
        <label>{{ submission.created_on }}</label>
    </div>
    <div class="form-group col-md-3">
        <span class="label label-info">Data Provider(s)</span><br/><br/>
        <label>{{ submission.provider_user_names() | join(', ') }} </label>
    </div>
</div>
