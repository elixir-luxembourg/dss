<div class="row">
    <div class="form-group col-md-3">
        <span class="label label-default">Submission Ref No</span><br/>
        <label>{{ submission.ref_name }}</label>
    </div>
    <div class="form-group col-md-3">
        <span class="label label-default">Title</span><br/>
        <label>{{ submission.title }}</label>
    </div>
    <div class="form-group col-md-3">
        <span class="label label-default">Created On</span><br/>
        <label>{{ submission.created_on }}</label>
    </div>
    <div class="form-group col-md-3">
        <span class="label label-default">Data Provider(s)</span><br/>
        <label>{{ submission.provider_user_names() | join(', ') }} </label>
    </div>
</div>
<div class="row">
    <div class="form-group col-md-11">
        <span class="label label-default">Upload Instructions</span>
        {% if submission.upload_instructions %}
            {% for line in submission.uploads_instructions_lines() %}
                <label>{{ line|urlize }}</label><br>
            {% endfor %}

        {% else %}
            <label>Instructions will be provided once you complete Dataset Registration and we create an upload link for you.</label>
        {% endif %}
    </div>
</div>
