<header class="row">
    <p class="col-md-2">
        <img src="/static/public/images/elixir.png" alt="elixir luxembourg logo"/>
    </p>
    <h1 class="col-md-6">
        ELIXIR-LU Data and
        Computing Platform</h1>
    <p id="login-buttons" class="col-md-4">
        <a href="

                {{ url_for_security('register') }}{% if 'next' in request.args %}?next={{ request.args.next|urlencode }}{% endif %}"
           class="btn btn-primary btn-raised">Sign-Up</a>
        <a href="
                {{ url_for_security('login') }}{% if 'next' in request.args %}?next={{ request.args.next|urlencode }}{% endif %}"
           class="btn btn-default btn-raised">Sign-In (ELIXIR AAI)</a>
    </p>
</header>
