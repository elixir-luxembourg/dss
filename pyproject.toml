[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elixir-dcp"
version = "0.4.0-dev"
description = "Elixir-LU Data and Computing Platform"
authors = [
    {name = "Valentin Grouès", email = "valentin.groues@uni.lu"}
]
keywords = ["elixir"]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Flask==3.1.1",
    "Flask-Assets==2.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Script==2.0.6",
    "Jinja2==3.1.6",
    "SQLAlchemy==2.0.43",
    "Werkzeug==3.1.3",
    "closure==20191111",
    "flask-caching==2.3.1",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.2.2",
    "Flask-Migrate==4.1.0",
    "flask-oidc==2.4.0",
    "Flask-Testing==0.8.1",
    "sqlalchemy-utils==0.41.2",
    "Flask-Mail==0.10.0",
    "Flask-Babel==4.0.0",
    "cssmin==0.2.0",
    "webassets==3.0.0",
    "requests==2.32.4",
    "weasyprint==66.0",
    "psycopg2-binary==2.9.10",
    "WTForms-Components==0.11.0",
    "schedule==1.2.2",
    "WTForms==3.2.1",
    "docxtpl==0.20.1",
    "Celery==5.5.3",
    "markupsafe==3.0.2",
    "itsdangerous==2.2.0",
    "email_validator==2.2.0",
]

[project.optional-dependencies]
dev = [
    "tox",
    "pep8",
    "bumpversion",
    "coverage",
    "pytest",
    "pytest-cov"
]
test = [
    "coverage",
    "pytest",
    "pytest-cov"
]

[project.urls]
Homepage = "https://git-r3lab.uni.lu/elixir/elixir-dcp"

[tool.setuptools]
packages = ["elixir_dcp"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
elixir_dcp = ["resources/*"]