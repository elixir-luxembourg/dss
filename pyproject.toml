[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elixir-dss"
version = "0.4.0-dev"
description = "Elixir-LU Data Submission System (DSS)"
authors = [
    {name = "Valentin Grouès", email = "valentin.groues@uni.lu"}
]
keywords = ["elixir"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "flask==3.1.3",
    "flask-assets==2.1.0",
    "flask-sqlalchemy==3.1.1",
    "flask-script==2.0.6",
    "jinja2==3.1.6",
    "sqlalchemy==2.0.49",
    "werkzeug==3.1.8",
    "rjsmin==1.2.5",
    "flask-caching==2.3.1",
    "flask-login==0.6.3",
    "flask-wtf==1.2.2",
    "flask-migrate==4.1.0",
    "authlib==1.6.10",
    "flask-testing==0.8.1",
    "sqlalchemy-utils==0.42.1",
    "flask-mail==0.10.0",
    "flask-babel==4.0.0",
    "cssmin==0.2.0",
    "webassets==3.0.0",
    "requests==2.33.1",
    "weasyprint==66.0",
    "wtforms-components==0.11.0",
    "schedule==1.2.2",
    "wtforms==3.2.1",
    "docxtpl==0.20.2",
    "celery==5.6.3",
    "markupsafe==3.0.3",
    "itsdangerous==2.2.0",
    "email_validator==2.3.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "tox",
    "pep8",
    "bumpversion",
    "coverage",
    "pytest",
    "pytest-cov",
    "ruff",
]
test = [
    "coverage",
    "pytest",
    "pytest-cov",
    "factory-boy>=3.3.3",
    "ruff",
]

[project.urls]
Homepage = "https://git-r3lab.uni.lu/elixir/elixir-dcp"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login",
]

[tool.setuptools]
packages = ["elixir_dss"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
elixir_dss = ["resources/*"]
