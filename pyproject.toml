[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elixir-dss"
version = "0.4.0-dev"
description = "Elixir-LU Data Submission System (DSS)"
authors = [
    {name = "Valentin Grouès", email = "valentin.groues@uni.lu"}
]
keywords = ["elixir"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Flask==3.1.1",
    "Flask-Assets==2.1.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Script==2.0.6",
    "Jinja2==3.1.6",
    "SQLAlchemy==2.0.43",
    "Werkzeug==3.1.3",
    "rjsmin==1.2.5",
    "flask-caching==2.3.1",
    "Flask-Login==0.6.3",
    "Flask-WTF==1.2.2",
    "Flask-Migrate==4.1.0",
    "Authlib==1.6.5",
    "Flask-Testing==0.8.1",
    "sqlalchemy-utils==0.41.2",
    "Flask-Mail==0.10.0",
    "Flask-Babel==4.0.0",
    "cssmin==0.2.0",
    "webassets==3.0.0",
    "requests==2.33.0",
    "weasyprint==66.0",
    "WTForms-Components==0.11.0",
    "schedule==1.2.2",
    "WTForms==3.2.1",
    "docxtpl==0.20.1",
    "Celery==5.5.3",
    "markupsafe==3.0.2",
    "itsdangerous==2.2.0",
    "email_validator==2.2.0",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = [
    "tox",
    "pep8",
    "bumpversion",
    "coverage",
    "pytest",
    "pytest-cov",
    "ruff",
]
test = [
    "coverage",
    "pytest",
    "pytest-cov",
    "factory-boy>=3.3.3",
    "ruff",
]

[project.urls]
Homepage = "https://git-r3lab.uni.lu/elixir/elixir-dcp"

[tool.setuptools]
packages = ["elixir_dss"]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
elixir_dss = ["resources/*"]
