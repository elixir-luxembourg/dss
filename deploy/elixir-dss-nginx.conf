server {
    listen 443 ssl http2;
    server_name dss-elixir-srv.lcsb.uni.lu;
    
    # SSL Configuration
    ssl_certificate /home/elixirdss/app-src/elixir-dss/deploy/cert.pem;
    ssl_certificate_key /home/elixirdss/app-src/elixir-dss/deploy/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    
    # Timeouts
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    proxy_read_timeout 600;
    send_timeout 600;
    client_max_body_size 100M;
    
    # Static files
    location /static/ {
        alias /home/elixirdss/app-src/elixir-dss/elixir_dss/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Application
    location / {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name dss-elixir-srv.lcsb.uni.lu;
    return 301 https://$server_name$request_uri;
}
