[Unit]
Description=Gunicorn for Elixir DSS
After=network.target

[Service]
User=elixirdss
WorkingDirectory=/home/elixirdss/app-src/elixir-dss
Environment="PATH=/home/elixirdss/app-src/elixir-dss/project_venv/bin:/usr/local/bin:/usr/bin:/bin"
ExecStart=/home/elixirdss/app-src/elixir-dss/project_venv/bin/gunicorn \
    --workers 1 \
    --timeout 600 \
    --bind 127.0.0.1:5000 \
    --access-logfile /home/elixirdss/app-logs/gunicorn-access.log \
    --error-logfile /home/elixirdss/app-logs/gunicorn-error.log \
    elixir_dss:app

[Install]
WantedBy=multi-user.target